<!DOCTYPE html>
<html>
<head>
    <title>Smart Parking Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Smart Parking Management System</h1>

   <p>Manage parking slots, vehicle entry and parking availability efficiently.</p>

    <h2>Parking Slot Status</h2>

    <table border="1">
        <tr>
            <th>Slot</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>A1</td>
            <td>Available</td>
        </tr>

        <tr>
            <td>A2</td>
            <td>Occupied</td>
        </tr>

        <tr>
            <td>A3</td>
            <td>Available</td>
        </tr>
    </table>

    <h2>Vehicle Entry</h2>

    <form>
        <label>Vehicle Number:</label>
        <input type="text" placeholder="Enter vehicle number">

        <br><br>

        <label>Parking Slot:</label>
        <input type="text" placeholder="Enter slot">

        <br><br>

        <button type="submit">Register Vehicle</button>
    </form>

</body>
</html>
